version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: aift_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: aift_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aift.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: aift-backend
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    depends_on:
      - postgres

volumes:
  pgdata:
